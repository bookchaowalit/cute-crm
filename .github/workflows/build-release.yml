name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'
  APP_PROJECT: 'app/AccountingETL.App.csproj'
  OUTPUT_NAME: 'AccountingETL'

jobs:
  # ============================================================
  # 1. Build + Test (all platforms)
  # ============================================================
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore (non-Windows projects only)
        run: |
          dotnet restore core/AccountingETL.Core.csproj
          dotnet restore adapters/express/AccountingETL.Adapters.Express.csproj
          dotnet restore adapters/postgresql/AccountingETL.Adapters.PostgreSQL.csproj
          dotnet restore adapters/erpnext/AccountingETL.Adapters.ErpNext.csproj
          dotnet restore tests/AccountingETL.Core.Tests/AccountingETL.Core.Tests.csproj
          dotnet restore tests/AccountingETL.Adapters.Express.Tests/AccountingETL.Adapters.Express.Tests.csproj

      - name: Build (all non-Windows projects)
        run: |
          dotnet build core/AccountingETL.Core.csproj
          dotnet build adapters/express/AccountingETL.Adapters.Express.csproj
          dotnet build adapters/postgresql/AccountingETL.Adapters.PostgreSQL.csproj
          dotnet build adapters/erpnext/AccountingETL.Adapters.ErpNext.csproj

      - name: Run tests
        run: dotnet test tests/AccountingETL.Core.Tests/AccountingETL.Core.Tests.csproj --no-build --verbosity normal && dotnet test tests/AccountingETL.Adapters.Express.Tests/AccountingETL.Adapters.Express.Tests.csproj --no-build --verbosity normal

  # ============================================================
  # 2. Build Windows release
  # ============================================================
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.APP_PROJECT }}

      - name: Publish single-file executable
        run: |
          dotnet publish ${{ env.APP_PROJECT }} `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:PublishTrimmed=false `
            -o ./publish

      - name: Show build output
        run: |
          dir ./publish
          $size = (Get-Item ./publish/${{ env.OUTPUT_NAME }}.exe).Length / 1MB
          Write-Output "File size: $([math]::Round($size, 2)) MB"

      - name: Copy helper scripts
        run: |
          copy app\install.bat ./publish/
          copy app\uninstall.bat ./publish/

      - name: Upload artifact (for PR checks)
        uses: actions/upload-artifact@v4
        with:
          name: AccountingETL-windows
          path: ./publish/${{ env.OUTPUT_NAME }}.exe
          retention-days: 7

      # ============================================================
      # Release (only on tag push)
      # ============================================================
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./publish/${{ env.OUTPUT_NAME }}.exe
            ./publish/install.bat
            ./publish/uninstall.bat
          body: |
            ## AccountingETL — ${{ github.ref_name }}

            Hexagonal Architecture ETL for **any** accounting program.

            ### Download
            - **AccountingETL.exe** — Single file, no install needed (~15 MB)

            ### Quick Start
            1. Double-click `AccountingETL.exe`
            2. Configure source path + PostgreSQL connection in Settings
            3. Click **Test Connection** → verify ✓
            4. Click **Save** — ETL runs automatically

            ### Install as Windows Service
            ```
            AccountingETL.exe /install
            AccountingETL.exe /uninstall
            ```

            ### Requirements
            - Windows 10/11 (64-bit)
            - PostgreSQL server
            - Accounting data files (DBF, CSV, etc.)

            ### Built-in Adapters
            | Source | Target |
            |--------|--------|
            | Express Accounting (DBF) | PostgreSQL (COPY) |
            | | ERPNext (REST API) |

            Read [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) for full docs.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
